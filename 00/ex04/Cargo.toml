[package]
name = "module00-ex04"
version = "0.1.0"
edition = "2021"
authors = ["dgaillet"]
description = "my answer to the fifth exercise of the first module of 42's Rust Piscine"
default-run = "module00-ex04"
publish = false

[[bin]]
name = "module00-ex04"
path = "src/main.rs"

[[bin]]
name = "other"
path = "src/other.rs"

[[bin]]
name = "test-overflows"
path = "src/overflow.rs"

[dependencies]

[profile.release]
strip = true

[profile.no-overflows]
inherits = "dev"
overflow-checks = false
